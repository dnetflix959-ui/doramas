story: '2.2'
gate: CONCERNS
status_reason: >-
  Schema, guarda de admin, lista, formulário com traduções e temporadas estão implementados conforme os
  critérios de aceite, e o trigger que fecha o REQ-001 da story 2.1 foi testado e confirmado. Um bug real
  e confirmado (não apenas plausível) fica registrado: editar e salvar um título agendado desloca
  silenciosamente o release_at a cada salvamento. O fluxo completo logado como admin segue sem verificação
  por falta de login de admin disponível no ambiente — herdado como limitação, não como falha nova.
reviewer: 'Quinn'
reviewed_revision: 'commit:63cc43f'
updated: '2026-11-06T23:20:00Z'
top_issues:
  - id: 'REL-001'
    severity: medium
    verdict: CONFIRMED
    finding: >-
      web/src/app/[lang]/admin/titulos/title-form.tsx preenche o campo <input type="datetime-local"> com
      `title.release_at.slice(0, 16)` — um timestamp UTC do banco cortado sem converter para o horário
      local do navegador. Ao salvar sem alterar essa data, actions.ts faz `new Date(releaseAtRaw).toISOString()`,
      que reinterpreta o texto como horário LOCAL DO SERVIDOR. Reproduzido com Node (TZ=America/Sao_Paulo):
      um release_at salvo como 2026-12-05T23:00:00Z volta como 2026-12-06T02:00:00Z depois de reabrir e
      salvar sem tocar no campo — desloca 3h a cada edição, cumulativamente.
    suggested_action: >-
      Converter o valor para o horário local do navegador ao preencher o campo (não um slice cru do ISO) e
      reconverter para UTC de forma explícita ao enviar — ou tratar release_at como "horário local do
      Gustavo" de ponta a ponta até existir seleção de fuso. Adicionar um teste que salva duas vezes seguidas
      sem alterar a data e confirma que o valor não muda.
  - id: 'TEST-002'
    severity: low
    verdict: CONFIRMED
    finding: >-
      O atributo `pattern` do campo "Link (slug)" em title-form.tsx é case-sensitive só minúsculas
      (`^[a-z0-9]+(-[a-z0-9]+)*$`), mas o servidor normaliza com `.toLowerCase()` antes de validar. Um slug
      digitado com qualquer letra maiúscula (ex.: "Amor-Em-Seul") é bloqueado pela validação nativa do
      navegador mesmo que o servidor o aceitasse normalmente depois de converter.
    suggested_action: >-
      Reaproveitar o mesmo normalizador no cliente (lowercase ao digitar/perder foco) ou remover o `pattern`
      e deixar a mensagem de erro do servidor cobrir o caso.
  - id: 'MNT-003'
    severity: low
    verdict: CONFIRMED
    finding: >-
      translateDbError() em actions.ts checa `message.includes("kind") && message.includes("content")` para
      mostrar uma mensagem amigável de troca de tipo bloqueada, mas a exceção real do trigger (migration
      20261107020000) está em português e não contém nem "kind" nem "content" — essa condição nunca é
      verdadeira. Sem efeito prático hoje porque o formulário de edição nunca envia `kind`, mas é código morto
      enganoso se alguém reativar a edição do tipo depois.
    suggested_action: 'Corrigir a comparação para o texto real da exceção, ou remover o ramo morto.'
  - id: 'TEST-003'
    severity: low
    finding: >-
      createSeason/deleteSeason descartam o `error` do Supabase sem checar — se o insert/delete falhar (corrida
      na numeração de temporada, RLS inesperada, rede), o admin não vê nenhum aviso, a página só não muda.
    suggested_action: 'Checar o `error` e redirecionar com uma mensagem, como já é feito para o caso de episódios existentes.'
  - id: 'TEST-004'
    severity: low
    finding: >-
      O fluxo completo logado como admin (criar/editar título, traduções, temporadas) não foi exercitado nem
      pelo @dev nem por mim — falta um usuário admin e login funcional neste ambiente (Google OAuth e marcação
      de admin pendentes desde a story 1.3). Risco herdado, não introduzido por esta story.
    suggested_action: 'Testar manualmente assim que houver um login de admin disponível (o Gustavo pode fazer isso).'
